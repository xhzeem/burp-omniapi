name: Build and publish versioned JAR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: versioned-release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Test, package, and release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Test and build the verified Shadow JAR
        run: ./gradlew clean build verifyShadowJar --no-daemon

      - name: Resolve the release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(./gradlew properties --no-daemon -q | awk '$1 == "version:" { print $2; exit }')"
          test -n "${base_version}"
          echo "version=${base_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${base_version}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: output/burp-omnibridge.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ steps.release.outputs.tag }}"
          release_title="Burp OmniBridge ${{ steps.release.outputs.version }}"
          release_notes="Automated verified build from commit ${GITHUB_SHA} on the main branch."

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release edit "${release_tag}" \
              --title "${release_title}" \
              --notes "${release_notes}" \
              --latest
          else
            gh release create "${release_tag}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --notes "${release_notes}" \
              --latest
          fi

          gh release upload "${release_tag}" \
            output/burp-omnibridge.jar \
            --clobber
